[package]
name = "sneeze"
version = "0.1.0"
edition = "2021"
description = "Guest-side SDK for Sneeze WASM modules (the single-Call ABI)."
license = "Apache-2.0"

# A plain library crate. Guest modules are cdylibs that depend on this crate via
# a path dependency, e.g.:
#   [dependencies]
#   sneeze = { path = "../../../sdk/rust" }
[lib]

# nanoserde parses the fixed-shape Open snapshot into typed records. Only the
# json feature is needed (no ron/toml/binary); it is an internal detail and is
# never exposed across the SDK's public API.
[dependencies]
nanoserde = { version = "0.2.1", default-features = false, features = ["json"] }
