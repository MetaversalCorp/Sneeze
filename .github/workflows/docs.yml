# Docs — drift detection for docs/ still in this repo (if present).
# Wiki publish lives in MetaversalCorp/SneezeDoc — see that repo's deploy-wiki.yml.
#
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/DocDrift/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/DocDrift/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docdrift:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Doc drift check (warn-only)
        run: python tools/DocDrift/docdrift.py
