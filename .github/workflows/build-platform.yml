name: Build Platform (reusable)

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: "Platform name for artifact prefix and cache keys"
      runs-on:
        required: true
        type: string
        description: "Runner label"
      cmake-args:
        required: true
        type: string
        description: "Platform-specific CMake args (space-separated)"
      rust-targets:
        required: false
        type: string
        default: ""
        description: "Rust targets to install (comma-separated, empty = no rust)"
      system-deps:
        required: false
        type: string
        default: ""
        description: "apt-get packages to install (Linux only)"
      setup-ndk:
        required: false
        type: boolean
        default: false
        description: "Install Android NDK"
      filament-host-artifact:
        required: false
        type: string
        default: ""
        description: "Artifact name with Filament host tools for cross-compile (e.g. linux-filament)"
    secrets:
      # PAT (or fine-grained token) with read access to private MetaversalCorp
      # deps (RMAP, Map). Optional: omit until those jobs run; public deps still build.
      DEP_GIT_TOKEN:
        required: false

jobs:
  # Generate tier matrices from deps/dependencies.json (longest-path layers).
  # Hand-maintained dep lists are gone -- add a dep to the manifest and it
  # lands in the correct tier automatically.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tier0: ${{ steps.gen.outputs.tier0 }}
      tier1: ${{ steps.gen.outputs.tier1 }}
      tier2: ${{ steps.gen.outputs.tier2 }}
      tier3: ${{ steps.gen.outputs.tier3 }}
      tier4: ${{ steps.gen.outputs.tier4 }}
      has_tier0: ${{ steps.gen.outputs.has_tier0 }}
      has_tier1: ${{ steps.gen.outputs.has_tier1 }}
      has_tier2: ${{ steps.gen.outputs.has_tier2 }}
      has_tier3: ${{ steps.gen.outputs.has_tier3 }}
      has_tier4: ${{ steps.gen.outputs.has_tier4 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: python3 tools/DepGraph/depgraph.py validate
      - name: Generate tier matrices
        id: gen
        run: python3 scripts/ci-tier-matrix.py --github-output

  tier0:
    needs: plan
    if: ${{ needs.plan.outputs.has_tier0 == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.tier0) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dep dir name
        id: dir
        shell: bash
        run: |
          DIR=$(python3 -c "import json; print(json.load(open('deps/dependencies.json'))['versions']['${{ matrix.dep }}']['folder'])")
          echo "name=$DIR" >> "$GITHUB_OUTPUT"

      - name: Auth for private MetaversalCorp deps
        env:
          DEP_GIT_TOKEN: ${{ secrets.DEP_GIT_TOKEN }}
        run: |
          if [ -z "$DEP_GIT_TOKEN" ]; then
            echo "DEP_GIT_TOKEN not set; skipping private-clone auth"
            exit 0
          fi
          # Must run BEFORE fingerprint: private branch tips (rmap/map/vox/
          # sneeze-sdk) are resolved via git ls-remote; without the token the
          # tip is empty and the cache would not invalidate when main moves.
          # Also clears checkout@v4's GITHUB_TOKEN extraheader so nested clones
          # (on cache miss) use DEP_GIT_TOKEN instead of a 403.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${DEP_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "Configured DEP_GIT_TOKEN for private github.com clones (len=${#DEP_GIT_TOKEN})"

      # Transitive fingerprint (this dep + closure): pinned refs, branch tips
      # via ls-remote, recipe hashes, shared deps CMake. A change to any
      # upstream dep invalidates this cache key.
      - name: Dependency fingerprint
        id: fp
        shell: bash
        run: |
          chmod +x scripts/ci-dep-fingerprint.sh
          echo "hash=$(scripts/ci-dep-fingerprint.sh ${{ matrix.dep }})" >> "$GITHUB_OUTPUT"

      - name: Cache ${{ matrix.dep }}
        id: cache
        uses: actions/cache@v4
        with:
          path: libs-${{ inputs.platform }}/${{ steps.dir.outputs.name }}
          key: ${{ inputs.platform }}-${{ matrix.dep }}-${{ inputs.platform == 'macos' && 'univ3-' || '' }}${{ steps.fp.outputs.hash }}

      - name: Install system deps
        if: inputs.system-deps != '' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Setup Android NDK
        if: inputs.setup-ndk && steps.cache.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Install Rust
        if: matrix.dep == 'wasmtime' && steps.cache.outputs.cache-hit != 'true' && inputs.rust-targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.rust-targets }}

      - name: Download Filament host tools
        if: matrix.dep == 'filament' && inputs.filament-host-artifact != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.filament-host-artifact }}
          path: filament-host

      - name: Build ${{ matrix.dep }}
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path || '' }}
        run: |
          CMAKE_ARGS="${{ inputs.cmake-args }}"
          CMAKE_ARGS="${CMAKE_ARGS//\$ANDROID_NDK_ROOT/$ANDROID_NDK_ROOT}"
          CMAKE_ARGS="${CMAKE_ARGS//cmake\/toolchain/${{ github.workspace }}/cmake/toolchain}"

          if [ "${{ matrix.dep }}" = "filament" ] && [ -d "filament-host" ]; then
            HOST_TOOLS=$(find filament-host -name "ImportExecutables-Release.cmake" -print -quit 2>/dev/null)
            if [ -n "$HOST_TOOLS" ]; then
              # ImportExecutables-Release.cmake bakes in absolute host-build
              # paths (e.g. .../libs-macos/filament/build/tools/cmgen/cmgen).
              # Rewrite those to point into our filament-host download dir so
              # the imported targets resolve on this runner.
              # -E (ERE) is required because BSD sed on macOS runners doesn't
              # support \| alternation in BRE.
              sed -i.bak -E \
                "s#/(home|Users)/runner/work/[^/]*/[^/]*/libs-[a-z]*#${{ github.workspace }}/filament-host#g" \
                "$HOST_TOOLS"
              # GH Actions upload-artifact strips execute bits — restore for
              # filament host tools (matc, cmgen, resgen, filamesh, ...).
              find filament-host -path '*/tools/*' -type f ! -name '*.cmake' -exec chmod +x {} +
              CMAKE_ARGS="$CMAKE_ARGS -DIMPORT_EXECUTABLES_HOST_FILE=${{ github.workspace }}/$HOST_TOOLS"
            fi
          fi
          DEPS_CMAKE=( -S deps -B build -GNinja
            -DDEP=${{ matrix.dep }}
            -DLIBS_DIR=${{ github.workspace }}/libs-${{ inputs.platform }}
            -DSNEEZE_DEP_REPO=${{ github.workspace }}/deps/repos
          )
          if [ "${{ inputs.platform }}" = "macos" ]; then
            cmake "${DEPS_CMAKE[@]}" \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            # shellcheck disable=SC2086
            cmake "${DEPS_CMAKE[@]}" $CMAKE_ARGS
          fi
          cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Verify macOS universal binaries (tier0)
        if: inputs.platform == 'macos' && steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/verify-macos-universal-libs.sh
          bash scripts/verify-macos-universal-libs.sh \
            "libs-${{ inputs.platform }}/${{ steps.dir.outputs.name }}/install"

      - name: Stage dep for upload
        shell: bash
        run: |
          # Put <DepFolder> at the artifact root so arrange can cp art/* → libs/.
          NAME="${{ steps.dir.outputs.name }}"
          DEP_DIR="libs-${{ inputs.platform }}/$NAME"
          if [ ! -d "$DEP_DIR" ]; then
            echo "Missing $DEP_DIR"
            exit 1
          fi
          rm -rf "$NAME"
          cp -a "$DEP_DIR" "$NAME"
          # Drop bulky build/ trees; keep filament host tools under build/tools.
          if [ "${{ matrix.dep }}" = "filament" ] && [ -d "$DEP_DIR/build/tools" ]; then
            rm -rf "$NAME/build"
            mkdir -p "$NAME/build"
            cp -a "$DEP_DIR/build/tools" "$NAME/build/"
          else
            rm -rf "$NAME/build"
          fi
          echo "Staged:" && ls -la "$NAME"

      - name: Upload dep artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-${{ matrix.dep }}
          path: ${{ steps.dir.outputs.name }}/
          retention-days: 90

  tier1:
    needs: [plan, tier0]
    if: ${{ !cancelled() && needs.plan.outputs.has_tier1 == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.tier1) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dep dir name
        id: dir
        shell: bash
        run: |
          DIR=$(python3 -c "import json; print(json.load(open('deps/dependencies.json'))['versions']['${{ matrix.dep }}']['folder'])")
          echo "name=$DIR" >> "$GITHUB_OUTPUT"

      - name: Auth for private MetaversalCorp deps
        env:
          DEP_GIT_TOKEN: ${{ secrets.DEP_GIT_TOKEN }}
        run: |
          if [ -z "$DEP_GIT_TOKEN" ]; then
            echo "DEP_GIT_TOKEN not set; skipping private-clone auth"
            exit 0
          fi
          # Must run BEFORE fingerprint: private branch tips (rmap/map/vox/
          # sneeze-sdk) are resolved via git ls-remote; without the token the
          # tip is empty and the cache would not invalidate when main moves.
          # Also clears checkout@v4's GITHUB_TOKEN extraheader so nested clones
          # (on cache miss) use DEP_GIT_TOKEN instead of a 403.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${DEP_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "Configured DEP_GIT_TOKEN for private github.com clones (len=${#DEP_GIT_TOKEN})"

      # Transitive fingerprint (this dep + closure): pinned refs, branch tips
      # via ls-remote, recipe hashes, shared deps CMake. A change to any
      # upstream dep invalidates this cache key.
      - name: Dependency fingerprint
        id: fp
        shell: bash
        run: |
          chmod +x scripts/ci-dep-fingerprint.sh
          echo "hash=$(scripts/ci-dep-fingerprint.sh ${{ matrix.dep }})" >> "$GITHUB_OUTPUT"

      - name: Cache ${{ matrix.dep }}
        id: cache
        uses: actions/cache@v4
        with:
          path: libs-${{ inputs.platform }}/${{ steps.dir.outputs.name }}
          key: ${{ inputs.platform }}-${{ matrix.dep }}-${{ inputs.platform == 'macos' && 'univ3-' || '' }}${{ steps.fp.outputs.hash }}

      - name: Install system deps
        if: inputs.system-deps != '' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Setup Android NDK
        if: inputs.setup-ndk && steps.cache.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Download artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.platform }}-*
          path: dep-artifacts

      - name: Arrange artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p libs-${{ inputs.platform }}
          # Each artifact carries one dep install tree (folder with install/).
          # Find those folders regardless of upload nesting (.dep-upload/, libs-*/, bare).
          for art in dep-artifacts/${{ inputs.platform }}-*; do
            [ -d "$art" ] || continue
            while IFS= read -r -d '' inst; do
              depdir=$(dirname "$inst")
              cp -a "$depdir" libs-${{ inputs.platform }}/
            done < <(find "$art" -type d -name install -print0 2>/dev/null)
          done
          find libs-${{ inputs.platform }} -path '*/install/bin/*' -type f -exec chmod +x {} +
          echo "Available deps:" && ls libs-${{ inputs.platform }}/

      # halogen compiles filament materials via matc. On cross-compile the
      # target-platform filament install has no matc — inject the host one.
      - name: Download Filament host tools for halogen cross-compile
        if: matrix.dep == 'halogen' && inputs.filament-host-artifact != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.filament-host-artifact }}
          path: filament-host

      - name: Stage host matc for halogen
        if: matrix.dep == 'halogen' && inputs.filament-host-artifact != '' && steps.cache.outputs.cache-hit != 'true'
        run: |
          MATC=$(find filament-host -name matc -type f -print -quit 2>/dev/null || true)
          if [ -n "$MATC" ]; then
            mkdir -p libs-${{ inputs.platform }}/filament/install/bin
            cp "$MATC" libs-${{ inputs.platform }}/filament/install/bin/matc
            chmod +x libs-${{ inputs.platform }}/filament/install/bin/matc
            echo "Staged host matc at libs-${{ inputs.platform }}/filament/install/bin/matc"
          fi

      - name: Build ${{ matrix.dep }}
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path || '' }}
        run: |
          CMAKE_ARGS="${{ inputs.cmake-args }}"
          CMAKE_ARGS="${CMAKE_ARGS//\$ANDROID_NDK_ROOT/$ANDROID_NDK_ROOT}"
          CMAKE_ARGS="${CMAKE_ARGS//cmake\/toolchain/${{ github.workspace }}/cmake/toolchain}"
          DEPS_CMAKE=( -S deps -B build -GNinja
            -DDEP=${{ matrix.dep }}
            -DLIBS_DIR=${{ github.workspace }}/libs-${{ inputs.platform }}
            -DSNEEZE_DEP_REPO=${{ github.workspace }}/deps/repos
          )
          if [ "${{ inputs.platform }}" = "macos" ]; then
            cmake "${DEPS_CMAKE[@]}" \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            # shellcheck disable=SC2086
            cmake "${DEPS_CMAKE[@]}" $CMAKE_ARGS
          fi
          cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Verify macOS universal binaries (tier1)
        if: inputs.platform == 'macos' && steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/verify-macos-universal-libs.sh
          bash scripts/verify-macos-universal-libs.sh \
            "libs-${{ inputs.platform }}/${{ steps.dir.outputs.name }}/install"

      - name: Stage dep for upload
        shell: bash
        run: |
          # Put <DepFolder> at the artifact root so arrange can cp art/* → libs/.
          NAME="${{ steps.dir.outputs.name }}"
          DEP_DIR="libs-${{ inputs.platform }}/$NAME"
          if [ ! -d "$DEP_DIR" ]; then
            echo "Missing $DEP_DIR"
            exit 1
          fi
          rm -rf "$NAME"
          cp -a "$DEP_DIR" "$NAME"
          # Drop bulky build/ trees; keep filament host tools under build/tools.
          if [ "${{ matrix.dep }}" = "filament" ] && [ -d "$DEP_DIR/build/tools" ]; then
            rm -rf "$NAME/build"
            mkdir -p "$NAME/build"
            cp -a "$DEP_DIR/build/tools" "$NAME/build/"
          else
            rm -rf "$NAME/build"
          fi
          echo "Staged:" && ls -la "$NAME"

      - name: Upload dep artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-${{ matrix.dep }}
          path: ${{ steps.dir.outputs.name }}/
          retention-days: 90

  tier2:
    needs: [plan, tier1]
    if: ${{ !cancelled() && needs.plan.outputs.has_tier2 == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.tier2) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dep dir name
        id: dir
        shell: bash
        run: |
          DIR=$(python3 -c "import json; print(json.load(open('deps/dependencies.json'))['versions']['${{ matrix.dep }}']['folder'])")
          echo "name=$DIR" >> "$GITHUB_OUTPUT"

