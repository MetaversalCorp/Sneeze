name: Build Platform (reusable)

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: "Platform name for artifact prefix and cache keys"
      runs-on:
        required: true
        type: string
        description: "Runner label"
      cmake-args:
        required: true
        type: string
        description: "Platform-specific CMake args (space-separated)"
      rust-targets:
        required: false
        type: string
        default: ""
        description: "Rust targets to install (comma-separated, empty = no rust)"
      system-deps:
        required: false
        type: string
        default: ""
        description: "apt-get packages to install (Linux only)"
      setup-ndk:
        required: false
        type: boolean
        default: false
        description: "Install Android NDK"
      filament-host-artifact:
        required: false
        type: string
        default: ""
        description: "Artifact name with Filament host tools for cross-compile (e.g. linux-filament)"
    secrets:
      # PAT (or fine-grained token) with read access to private MetaversalCorp
      # deps (RMAP, Map). Optional: omit until those jobs run; public deps still build.
      DEP_GIT_TOKEN:
        required: false

jobs:
  tier0:
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        dep: [spirv-headers, anari-sdk, openxr-sdk, boringssl, jwt-cpp, spirv-cross, freetype, nlohmann-json, fastgltf, sneeze-sdk, asio, websocketpp, wasmtime, filament]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        if: inputs.system-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Setup Android NDK
        if: inputs.setup-ndk
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      # CMake target names (lowercase) differ from ExternalProject dir names
      # (mixed case, matching upstream repos). This map bridges the two for
      # cache paths and artifact uploads. If the SuperBuild dirs were renamed
      # to lowercase, this step could be removed and matrix.dep used directly.
      - name: Resolve dep dir name
        id: dir
        shell: bash
        run: |
          case "${{ matrix.dep }}" in
            spirv-headers) DIR=SPIRV-Headers ;;
            spirv-tools)   DIR=SPIRV-Tools ;;
            spirv-cross)   DIR=SPIRV-Cross ;;
            vox)           DIR=Vox ;;
            anari-sdk)     DIR=ANARI-SDK ;;
            openxr-sdk)    DIR=OpenXR-SDK ;;
            freetype)      DIR=FreeType ;;
            rmlui)         DIR=RmlUi ;;
            wasmtime)      DIR=Wasmtime ;;
            halogen)       DIR=Halogen ;;
            sneeze-sdk)    DIR=SneezeSDK ;;
            rmap)          DIR=RMAP ;;
            map)           DIR=Map ;;
            *)             DIR="${{ matrix.dep }}" ;;
          esac
          echo "name=$DIR" >> "$GITHUB_OUTPUT"

      - name: Cache ${{ matrix.dep }}
        id: cache
        uses: actions/cache@v4
        with:
          path: libs-${{ inputs.platform }}/${{ steps.dir.outputs.name }}
          key: ${{ inputs.platform }}-${{ matrix.dep }}-${{ inputs.platform == 'macos' && 'univ3-' || '' }}${{ hashFiles('CMakeLists.txt', format('deps/{0}.cmake', matrix.dep), 'deps/CMakeLists.txt') }}

      - name: Install Rust
        if: matrix.dep == 'wasmtime' && steps.cache.outputs.cache-hit != 'true' && inputs.rust-targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.rust-targets }}

      - name: Download Filament host tools
        if: matrix.dep == 'filament' && inputs.filament-host-artifact != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.filament-host-artifact }}
          path: filament-host

      - name: Auth for private MetaversalCorp deps
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          DEP_GIT_TOKEN: ${{ secrets.DEP_GIT_TOKEN }}
        run: |
          if [ -z "$DEP_GIT_TOKEN" ]; then
            echo "DEP_GIT_TOKEN not set; skipping private-clone auth"
            exit 0
          fi
          # checkout@v4 sets local http.*.extraheader to GITHUB_TOKEN. Nested
          # git clones under this work tree inherit that header; GITHUB_TOKEN
          # cannot read sibling private repos (RMAP/Map) and yields 403
          # "Write access to repository not granted". Clear it so url.insteadOf
          # with DEP_GIT_TOKEN is what authenticates.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${DEP_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "Configured DEP_GIT_TOKEN for private github.com clones (len=${#DEP_GIT_TOKEN})"

      - name: Build ${{ matrix.dep }}
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path || '' }}
        run: |
          CMAKE_ARGS="${{ inputs.cmake-args }}"
          CMAKE_ARGS="${CMAKE_ARGS//\$ANDROID_NDK_ROOT/$ANDROID_NDK_ROOT}"
          # Toolchain paths are relative to repo root — make absolute
          CMAKE_ARGS="${CMAKE_ARGS//cmake\/toolchain/${{ github.workspace }}/cmake/toolchain}"

          if [ "${{ matrix.dep }}" = "filament" ] && [ -d "filament-host" ]; then
            HOST_TOOLS=$(find filament-host -name "ImportExecutables-Release.cmake" -print -quit 2>/dev/null)
            if [ -n "$HOST_TOOLS" ]; then
              # ImportExecutables-Release.cmake bakes in absolute host-build
              # paths (e.g. .../libs-macos/filament/build/tools/cmgen/cmgen).
              # Rewrite those to point into our filament-host download dir so
              # the imported targets resolve on this runner.
              # -E (ERE) is required because BSD sed on macOS runners doesn't
              # support \| alternation in BRE.
              sed -i.bak -E \
                "s#/(home|Users)/runner/work/[^/]*/[^/]*/libs-[a-z]*#${{ github.workspace }}/filament-host#g" \
                "$HOST_TOOLS"
              # GH Actions upload-artifact strips execute bits — restore for
              # filament host tools (matc, cmgen, resgen, filamesh, ...).
              find filament-host -path '*/tools/*' -type f ! -name '*.cmake' -exec chmod +x {} +
              CMAKE_ARGS="$CMAKE_ARGS -DIMPORT_EXECUTABLES_HOST_FILE=${{ github.workspace }}/$HOST_TOOLS"
            fi
          fi

          DEPS_CMAKE=( -S deps -B build -GNinja
            -DDEP=${{ matrix.dep }}
            -DLIBS_DIR=${{ github.workspace }}/libs-${{ inputs.platform }}
            -DSNEEZE_DEP_REPO=${{ github.workspace }}/deps/repos
          )
          if [ "${{ inputs.platform }}" = "macos" ]; then
            cmake "${DEPS_CMAKE[@]}" \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            # shellcheck disable=SC2086
            cmake "${DEPS_CMAKE[@]}" $CMAKE_ARGS
          fi
          cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Verify macOS universal binaries (tier0)
        if: inputs.platform == 'macos' && steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/verify-macos-universal-libs.sh
          bash scripts/verify-macos-universal-libs.sh \
            "libs-${{ inputs.platform }}/${{ steps.dir.outputs.name }}/install"

      - name: Upload dep artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-${{ matrix.dep }}
          path: |
            libs-${{ inputs.platform }}/**
            !libs-${{ inputs.platform }}/*/build/**
            libs-${{ inputs.platform }}/filament/build/tools/**
          retention-days: 90

  tier1:
    needs: tier0
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dep: spirv-tools
          - dep: halogen
          - dep: curl
          - dep: vox
          - dep: rmlui
          - dep: socketio
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        if: inputs.system-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Setup Android NDK
        if: inputs.setup-ndk
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.platform }}-*
          path: dep-artifacts

      - name: Arrange artifacts
        run: |
          mkdir -p libs-${{ inputs.platform }}
          for d in dep-artifacts/${{ inputs.platform }}-*/*; do
            [ -d "$d" ] && cp -a "$d" libs-${{ inputs.platform }}/ 2>/dev/null || true
          done
          # GH Actions upload-artifact strips execute bits — restore for bin/ tools
          find libs-${{ inputs.platform }} -path '*/install/bin/*' -type f -exec chmod +x {} +
          echo "Available deps:" && ls libs-${{ inputs.platform }}/

      # halogen compiles filament materials via matc. On cross-compile the
      # target-platform filament install has no matc — inject the host one.
      - name: Download Filament host tools for halogen cross-compile
        if: matrix.dep == 'halogen' && inputs.filament-host-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.filament-host-artifact }}
          path: filament-host

      - name: Stage host matc for halogen
        if: matrix.dep == 'halogen' && inputs.filament-host-artifact != ''
        run: |
          MATC=$(find filament-host -name matc -type f -print -quit 2>/dev/null || true)
          if [ -n "$MATC" ]; then
            mkdir -p libs-${{ inputs.platform }}/filament/install/bin
            cp "$MATC" libs-${{ inputs.platform }}/filament/install/bin/matc
            chmod +x libs-${{ inputs.platform }}/filament/install/bin/matc
            echo "Staged host matc at libs-${{ inputs.platform }}/filament/install/bin/matc"
          fi

      - name: Auth for private MetaversalCorp deps
        env:
          DEP_GIT_TOKEN: ${{ secrets.DEP_GIT_TOKEN }}
        run: |
          if [ -z "$DEP_GIT_TOKEN" ]; then
            echo "DEP_GIT_TOKEN not set; skipping private-clone auth"
            exit 0
          fi
          # checkout@v4 sets local http.*.extraheader to GITHUB_TOKEN. Nested
          # git clones under this work tree inherit that header; GITHUB_TOKEN
          # cannot read sibling private repos (RMAP/Map) and yields 403
          # "Write access to repository not granted". Clear it so url.insteadOf
          # with DEP_GIT_TOKEN is what authenticates.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${DEP_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "Configured DEP_GIT_TOKEN for private github.com clones (len=${#DEP_GIT_TOKEN})"

      - name: Build ${{ matrix.dep }}
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path || '' }}
        run: |
          CMAKE_ARGS="${{ inputs.cmake-args }}"
          CMAKE_ARGS="${CMAKE_ARGS//\$ANDROID_NDK_ROOT/$ANDROID_NDK_ROOT}"
          CMAKE_ARGS="${CMAKE_ARGS//cmake\/toolchain/${{ github.workspace }}/cmake/toolchain}"
          DEPS_CMAKE=( -S deps -B build -GNinja
            -DDEP=${{ matrix.dep }}
            -DLIBS_DIR=${{ github.workspace }}/libs-${{ inputs.platform }}
            -DSNEEZE_DEP_REPO=${{ github.workspace }}/deps/repos
          )
          if [ "${{ inputs.platform }}" = "macos" ]; then
            cmake "${DEPS_CMAKE[@]}" \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            # shellcheck disable=SC2086
            cmake "${DEPS_CMAKE[@]}" $CMAKE_ARGS
          fi
          cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Verify macOS universal binaries (tier1)
        if: inputs.platform == 'macos'
        run: |
          case "${{ matrix.dep }}" in
            spirv-tools) DIR=SPIRV-Tools ;;
            rmlui)       DIR=RmlUi ;;
            halogen)     DIR=Halogen ;;
            curl)        DIR=curl ;;
            vox)         DIR=Vox ;;
            socketio)    DIR=socketio ;;
            *)           DIR="${{ matrix.dep }}" ;;
          esac
          chmod +x scripts/verify-macos-universal-libs.sh
          bash scripts/verify-macos-universal-libs.sh \
            "libs-${{ inputs.platform }}/$DIR/install"

      - name: Upload dep artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-${{ matrix.dep }}
          path: |
            libs-${{ inputs.platform }}/**
            !libs-${{ inputs.platform }}/*/build/**
            libs-${{ inputs.platform }}/filament/build/tools/**
          retention-days: 90

  tier2:
    needs: tier1
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dep: glslang
          - dep: rmap
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        if: inputs.system-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Setup Android NDK
        if: inputs.setup-ndk
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.platform }}-*
          path: dep-artifacts

      - name: Arrange artifacts
        run: |
          mkdir -p libs-${{ inputs.platform }}
          for d in dep-artifacts/${{ inputs.platform }}-*/*; do
            [ -d "$d" ] && cp -a "$d" libs-${{ inputs.platform }}/ 2>/dev/null || true
          done
          find libs-${{ inputs.platform }} -path '*/install/bin/*' -type f -exec chmod +x {} +
          echo "Available deps:" && ls libs-${{ inputs.platform }}/

      - name: Auth for private MetaversalCorp deps
        env:
          DEP_GIT_TOKEN: ${{ secrets.DEP_GIT_TOKEN }}
        run: |
          if [ -z "$DEP_GIT_TOKEN" ]; then
            echo "DEP_GIT_TOKEN not set; skipping private-clone auth"
            exit 0
          fi
          # checkout@v4 sets local http.*.extraheader to GITHUB_TOKEN. Nested
          # git clones under this work tree inherit that header; GITHUB_TOKEN
          # cannot read sibling private repos (RMAP/Map) and yields 403
          # "Write access to repository not granted". Clear it so url.insteadOf
          # with DEP_GIT_TOKEN is what authenticates.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${DEP_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "Configured DEP_GIT_TOKEN for private github.com clones (len=${#DEP_GIT_TOKEN})"

      - name: Build ${{ matrix.dep }}
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path || '' }}
        run: |
          CMAKE_ARGS="${{ inputs.cmake-args }}"
          CMAKE_ARGS="${CMAKE_ARGS//\$ANDROID_NDK_ROOT/$ANDROID_NDK_ROOT}"
          # Toolchain paths are relative to repo root — make absolute
          CMAKE_ARGS="${CMAKE_ARGS//cmake\/toolchain/${{ github.workspace }}/cmake/toolchain}"
          echo "Available deps:" && ls libs-${{ inputs.platform }}/ || true
          DEPS_CMAKE=( -S deps -B build -GNinja
            -DDEP=${{ matrix.dep }}
            -DLIBS_DIR=${{ github.workspace }}/libs-${{ inputs.platform }}
            -DSNEEZE_DEP_REPO=${{ github.workspace }}/deps/repos
          )
          if [ "${{ inputs.platform }}" = "macos" ]; then
            cmake "${DEPS_CMAKE[@]}" \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            # shellcheck disable=SC2086
            cmake "${DEPS_CMAKE[@]}" $CMAKE_ARGS
          fi
          cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Verify macOS universal binaries (tier2)
        if: inputs.platform == 'macos'
        run: |
          case "${{ matrix.dep }}" in
            glslang) DIR=glslang ;;
            rmap)    DIR=RMAP ;;
            *)       DIR="${{ matrix.dep }}" ;;
          esac
          chmod +x scripts/verify-macos-universal-libs.sh
          bash scripts/verify-macos-universal-libs.sh \
            "libs-${{ inputs.platform }}/$DIR/install"

      - name: Upload dep artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-${{ matrix.dep }}
          path: |
            libs-${{ inputs.platform }}/**
            !libs-${{ inputs.platform }}/*/build/**
            libs-${{ inputs.platform }}/filament/build/tools/**
          retention-days: 90

  # map needs RMAP installed (tier2). Separate tier so find_package(RMAP) resolves.
  tier3:
    needs: tier2
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dep: map
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        if: inputs.system-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Setup Android NDK
        if: inputs.setup-ndk
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.platform }}-*
          path: dep-artifacts

      - name: Arrange artifacts
        run: |
          mkdir -p libs-${{ inputs.platform }}
          for d in dep-artifacts/${{ inputs.platform }}-*/*; do
            [ -d "$d" ] && cp -a "$d" libs-${{ inputs.platform }}/ 2>/dev/null || true
          done
          find libs-${{ inputs.platform }} -path '*/install/bin/*' -type f -exec chmod +x {} +
          echo "Available deps:" && ls libs-${{ inputs.platform }}/

      - name: Auth for private MetaversalCorp deps
        env:
          DEP_GIT_TOKEN: ${{ secrets.DEP_GIT_TOKEN }}
        run: |
          if [ -z "$DEP_GIT_TOKEN" ]; then
            echo "DEP_GIT_TOKEN not set; skipping private-clone auth"
            exit 0
          fi
          # checkout@v4 sets local http.*.extraheader to GITHUB_TOKEN. Nested
          # git clones under this work tree inherit that header; GITHUB_TOKEN
          # cannot read sibling private repos (RMAP/Map) and yields 403
          # "Write access to repository not granted". Clear it so url.insteadOf
          # with DEP_GIT_TOKEN is what authenticates.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${DEP_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "Configured DEP_GIT_TOKEN for private github.com clones (len=${#DEP_GIT_TOKEN})"

      - name: Build ${{ matrix.dep }}
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path || '' }}
        run: |
          CMAKE_ARGS="${{ inputs.cmake-args }}"
          CMAKE_ARGS="${CMAKE_ARGS//\$ANDROID_NDK_ROOT/$ANDROID_NDK_ROOT}"
          CMAKE_ARGS="${CMAKE_ARGS//cmake\/toolchain/${{ github.workspace }}/cmake/toolchain}"
          echo "Available deps:" && ls libs-${{ inputs.platform }}/ || true
          DEPS_CMAKE=( -S deps -B build -GNinja
            -DDEP=${{ matrix.dep }}
            -DLIBS_DIR=${{ github.workspace }}/libs-${{ inputs.platform }}
            -DSNEEZE_DEP_REPO=${{ github.workspace }}/deps/repos
          )
          if [ "${{ inputs.platform }}" = "macos" ]; then
            cmake "${DEPS_CMAKE[@]}" \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            # shellcheck disable=SC2086
            cmake "${DEPS_CMAKE[@]}" $CMAKE_ARGS
          fi
          cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Verify macOS universal binaries (tier3)
        if: inputs.platform == 'macos'
        run: |
          chmod +x scripts/verify-macos-universal-libs.sh
          bash scripts/verify-macos-universal-libs.sh \
            "libs-${{ inputs.platform }}/Map/install"

      - name: Upload dep artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-${{ matrix.dep }}
          path: |
            libs-${{ inputs.platform }}/**
            !libs-${{ inputs.platform }}/*/build/**
            libs-${{ inputs.platform }}/filament/build/tools/**
          retention-days: 90

  sneeze:
    needs: [tier0, tier1, tier2, tier3]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        if: inputs.system-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Setup Android NDK
        if: inputs.setup-ndk
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.platform }}-*
          path: dep-artifacts

      - name: Arrange artifacts
        run: |
          mkdir -p libs-${{ inputs.platform }}
          for d in dep-artifacts/${{ inputs.platform }}-*/*; do
            [ -d "$d" ] && cp -a "$d" libs-${{ inputs.platform }}/ 2>/dev/null || true
          done
          # GH Actions upload-artifact strips execute bits — restore for bin/ tools
          find libs-${{ inputs.platform }} -path '*/install/bin/*' -type f -exec chmod +x {} +
          echo "Available deps:" && ls libs-${{ inputs.platform }}/

      - name: Verify macOS universal deps before link
        if: inputs.platform == 'macos'
        run: |
          chmod +x scripts/verify-macos-universal-libs.sh
          for INST in libs-${{ inputs.platform }}/*/install; do
            if [ -d "$INST" ]; then
              echo "--- $INST ---"
              bash scripts/verify-macos-universal-libs.sh "$INST"
            fi
          done

      - name: Install Rust
        if: inputs.rust-targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.rust-targets }}

      # Build Sneeze directly from src/, NOT via SuperBuild. The SuperBuild
      # would re-run ExternalProject update steps for all deps even when
      # they're already installed from artifacts. Building src/ directly
      # uses find_package/find_library against the pre-built LIBS_DIR.
      - name: Build Sneeze
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path || '' }}
        run: |
          CMAKE_ARGS="${{ inputs.cmake-args }}"
          CMAKE_ARGS="${CMAKE_ARGS//\$ANDROID_NDK_ROOT/$ANDROID_NDK_ROOT}"
          # Toolchain paths are relative to repo root — make absolute
          CMAKE_ARGS="${CMAKE_ARGS//cmake\/toolchain/${{ github.workspace }}/cmake/toolchain}"
          if [ "${{ inputs.platform }}" = "macos" ]; then
            cmake -S src -B build-sneeze -GNinja \
              -DLIBS_DIR=${{ github.workspace }}/libs-${{ inputs.platform }} \
              -DSNEEZE_PLATFORM=${{ inputs.platform }} \
              -DSNEEZE_ENABLE_WASM=ON \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          else
            # shellcheck disable=SC2086
            cmake -S src -B build-sneeze -GNinja \
              -DLIBS_DIR=${{ github.workspace }}/libs-${{ inputs.platform }} \
              -DSNEEZE_PLATFORM=${{ inputs.platform }} \
              -DSNEEZE_ENABLE_WASM=ON \
              $CMAKE_ARGS
          fi
          cmake --build build-sneeze --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Verify macOS universal libSneeze
        if: inputs.platform == 'macos'
        run: |
          set -e
          LIB=$(find build-sneeze -name 'libSneeze.a' -print -quit)
          if [ -n "$LIB" ]; then
            echo "=== $LIB ==="
            lipo -info "$LIB"
            lipo -info "$LIB" | grep -q arm64
            lipo -info "$LIB" | grep -q x86_64
          fi

      - name: Run tests
        if: ${{ !inputs.setup-ndk }}
        run: |
          cd build-sneeze
          ctest --output-on-failure --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu) || true

      # One bundle per platform so the parent Build run exposes linux-libs, etc.
      - name: Upload platform libs bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-libs
          path: libs-${{ inputs.platform }}/
          retention-days: 90
