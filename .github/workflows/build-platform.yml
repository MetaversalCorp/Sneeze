          cp -a "$DEP_DIR" "$NAME"
          # Drop bulky build/ trees; keep filament host tools under build/tools.
          if [ "${{ matrix.dep }}" = "filament" ] && [ -d "$DEP_DIR/build/tools" ]; then
            rm -rf "$NAME/build"
            mkdir -p "$NAME/build"
            cp -a "$DEP_DIR/build/tools" "$NAME/build/"
          else
            rm -rf "$NAME/build"
          fi
          echo "Staged:" && ls -la "$NAME"

      - name: Upload dep artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-${{ matrix.dep }}
          path: ${{ steps.dir.outputs.name }}/
          retention-days: 90

  tier3:
    needs: [plan, tier2]
    if: ${{ !cancelled() && needs.plan.outputs.has_tier3 == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
