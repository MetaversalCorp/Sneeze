        id: fp
        shell: bash
        run: |
          chmod +x scripts/ci-dep-fingerprint.sh
          echo "hash=$(scripts/ci-dep-fingerprint.sh ${{ matrix.dep }})" >> "$GITHUB_OUTPUT"

      - name: Cache ${{ matrix.dep }}
        id: cache
        uses: actions/cache@v4
        with:
          path: libs-${{ inputs.platform }}/${{ steps.dir.outputs.name }}
          key: ${{ inputs.platform }}-${{ matrix.dep }}-${{ inputs.platform == 'macos' && 'univ3-' || '' }}${{ steps.fp.outputs.hash }}

      - name: Install system deps
        if: inputs.system-deps != '' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.system-deps }}

      - name: Setup Android NDK
        if: inputs.setup-ndk && steps.cache.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Download artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
